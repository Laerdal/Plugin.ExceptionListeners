# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      nuget:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "FluentAssertions" # Ignore major-version updates FluentAssertions from version 8 and above
        versions: [ ">= 8.0.0" ] # because FluentAssertions requires a paid license for corporate use
        update-types: [ "version-update:semver-major" ]
      # Stay on the 10.0.x line while the library targets net10. A major bump of Microsoft.Extensions.*
      # raises the dependency floor for every consumer, and the analyzer and SourceLink packages pair
      # with the SDK. Revisit when the library moves to net11.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.CodeAnalysis.NetAnalyzers"
        update-types: [ "version-update:semver-major" ]
      - dependency-name: "Microsoft.SourceLink.GitHub"
        update-types: [ "version-update:semver-major" ]
